name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: gbao86
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff007f&color_dots=#ebedf0,#a7f3d0,#34d399,#059669,#047857
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff2a85&color_dots=#121124,#2b1b54,#6b21a8,#06b6d4,#22d3ee
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
